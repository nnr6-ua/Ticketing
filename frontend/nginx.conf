server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonda de salud usada por Docker Compose.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy inverso hacia FastAPI. El frontend compilado usa rutas relativas
    # (/api/...), de modo que la app funciona en el mismo origen que la SPA.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Aplicación de una sola página: las rutas de Vue se resuelven en cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros con hash de Vite pueden cachearse durante un año.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

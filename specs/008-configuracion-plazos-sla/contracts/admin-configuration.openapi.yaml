openapi: 3.0.3
info:
  title: API de configuración administrativa (HU-08)
  version: 1.0.0
  description: |
    Contrato de los endpoints de administración de categorías, prioridades,
    matriz de plazos SLA e histórico de configuración.

    Todas las rutas exigen `Authorization: Bearer <JWT>` y el rol `admin`.
    Cualquier otro rol recibe `403 forbidden` sin datos de configuración.
    Los comandos se modelan como recursos `POST` para mantener la
    compatibilidad con el cliente HTTP existente.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Admin · Categorías
  - name: Admin · Prioridades
  - name: Admin · Matriz SLA
  - name: Admin · Histórico
paths:
  /api/v1/admin/categories:
    get:
      tags: [Admin · Categorías]
      summary: Lista todas las categorías
      operationId: listAdminCategories
      responses:
        '200':
          description: Categorías, incluidas inactivas y de sistema
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin · Categorías]
      summary: Crea una categoría
      operationId: createAdminCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/categories/{category_id}/updates:
    post:
      tags: [Admin · Categorías]
      summary: Edita, activa, desactiva o cambia el default de una categoría
      operationId: updateAdminCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/categories/{category_id}/deletion:
    post:
      tags: [Admin · Categorías]
      summary: Elimina una categoría sin referencias
      operationId: deleteAdminCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Categoría eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/priorities:
    get:
      tags: [Admin · Prioridades]
      summary: Lista todas las prioridades
      operationId: listAdminPriorities
      responses:
        '200':
          description: Prioridades, incluidas inactivas y de sistema
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriorityAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin · Prioridades]
      summary: Crea una prioridad
      operationId: createAdminPriority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityCreateRequest'
      responses:
        '201':
          description: Prioridad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/priorities/{priority_id}/updates:
    post:
      tags: [Admin · Prioridades]
      summary: Edita, activa, desactiva o cambia el default de una prioridad
      operationId: updateAdminPriority
      parameters:
        - $ref: '#/components/parameters/PriorityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityUpdateRequest'
      responses:
        '200':
          description: Prioridad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/priorities/{priority_id}/deletion:
    post:
      tags: [Admin · Prioridades]
      summary: Elimina una prioridad sin referencias
      operationId: deleteAdminPriority
      parameters:
        - $ref: '#/components/parameters/PriorityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Prioridad eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/sla-rules:
    get:
      tags: [Admin · Matriz SLA]
      summary: Obtiene la matriz vigente y las combinaciones activas
      operationId: getAdminSlaMatrix
      responses:
        '200':
          description: Matriz vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaMatrixResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/sla-rules/batch:
    post:
      tags: [Admin · Matriz SLA]
      summary: Crea, actualiza y retira celdas de forma atómica
      operationId: saveAdminSlaBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaBatchRequest'
      responses:
        '200':
          description: Lote aplicado en una única versión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaBatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/sla-rules/{rule_id}/retirement:
    post:
      tags: [Admin · Matriz SLA]
      summary: Retira una regla vigente
      operationId: retireAdminSlaRule
      parameters:
        - $ref: '#/components/parameters/RuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaRetireRequest'
      responses:
        '200':
          description: Regla retirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlaBatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/admin/config-history:
    get:
      tags: [Admin · Histórico]
      summary: Consulta el histórico de cambios de configuración
      operationId: listAdminConfigHistory
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: entity_type
          in: query
          schema:
            $ref: '#/components/schemas/ConfigEntityType'
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/ConfigAction'
        - name: configuration_version_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Histórico paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PriorityId:
      name: priority_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: El usuario no tiene rol admin
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Entidad no encontrada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Conflicto de versión, duplicado o entidad referenciada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Datos no válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: stale_configuration
            message:
              type: string
              example: La configuración ha cambiado. Recarga y vuelve a intentarlo.

    UserRef:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

    ConfigurationVersionRef:
      type: object
      required: [id, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        created_by:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          nullable: true

    CategoryRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    PriorityRef:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: integer
          minimum: 1
          maximum: 4
        color:
          type: string
          nullable: true
        base_hours:
          type: string
          nullable: true
          example: '8.00'

    CategoryAdmin:
      allOf:
        - $ref: '#/components/schemas/CategoryRef'
        - type: object
          required:
            - description
            - keywords
            - is_active
            - is_default
            - is_system
            - sort_order
            - revision
            - ticket_count
            - rule_count
            - can_delete
          properties:
            description:
              type: string
              nullable: true
            keywords:
              type: array
              items:
                type: string
            is_active:
              type: boolean
            is_default:
              type: boolean
            is_system:
              type: boolean
            sort_order:
              type: integer
            revision:
              type: integer
              minimum: 1
            ticket_count:
              type: integer
              minimum: 0
            rule_count:
              type: integer
              minimum: 0
            can_delete:
              type: boolean

    PriorityAdmin:
      allOf:
        - $ref: '#/components/schemas/PriorityRef'
        - type: object
          required:
            - keywords
            - is_active
            - is_default
            - is_system
            - sort_order
            - revision
            - ticket_count
            - rule_count
            - can_delete
          properties:
            keywords:
              type: array
              items:
                type: string
            is_active:
              type: boolean
            is_default:
              type: boolean
            is_system:
              type: boolean
            sort_order:
              type: integer
            revision:
              type: integer
              minimum: 1
            ticket_count:
              type: integer
              minimum: 0
            rule_count:
              type: integer
              minimum: 0
            can_delete:
              type: boolean

    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
          nullable: true
        keywords:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 50
        sort_order:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        is_default:
          type: boolean
          default: false

    CategoryUpdateRequest:
      type: object
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
          nullable: true
        keywords:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 50
        sort_order:
          type: integer
          minimum: 0
          maximum: 9999
        is_active:
          type: boolean
        is_default:
          type: boolean
        replacement_default_id:
          type: string
          format: uuid
          nullable: true

    PriorityCreateRequest:
      type: object
      required: [name, level, base_hours]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        level:
          type: integer
          minimum: 1
          maximum: 4
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
        base_hours:
          type: string
          pattern: '^\d{1,4}(\.\d{1,2})?$'
          example: '8.00'
        keywords:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 50
        sort_order:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        is_default:
          type: boolean
          default: false

    PriorityUpdateRequest:
      type: object
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 50
        level:
          type: integer
          minimum: 1
          maximum: 4
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          nullable: true
        base_hours:
          type: string
          pattern: '^\d{1,4}(\.\d{1,2})?$'
        keywords:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 50
        sort_order:
          type: integer
          minimum: 0
          maximum: 9999
        is_active:
          type: boolean
        is_default:
          type: boolean
        replacement_default_id:
          type: string
          format: uuid
          nullable: true

    DeleteRequest:
      type: object
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1

    DeleteResponse:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
        id:
          type: string
          format: uuid
        configuration_version:
          $ref: '#/components/schemas/ConfigurationVersionRef'

    SlaRuleAdmin:
      type: object
      required:
        - id
        - category
        - priority
        - hours
        - valid_from_version
        - configuration_version_id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/CategoryRef'
        priority:
          $ref: '#/components/schemas/PriorityRef'
        hours:
          type: string
          example: '6.00'
        valid_from_version:
          type: integer
          minimum: 1
        configuration_version_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/UserRef'

    SlaMatrixResponse:
      type: object
      required: [configuration_version, items, combinations]
      properties:
        configuration_version:
          $ref: '#/components/schemas/ConfigurationVersionRef'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SlaRuleAdmin'
        combinations:
          type: object
          required: [categories, priorities]
          properties:
            categories:
              type: array
              items:
                $ref: '#/components/schemas/CategoryRef'
            priorities:
              type: array
              items:
                $ref: '#/components/schemas/PriorityRef'

    SlaUpsertChange:
      type: object
      required: [operation, category_id, priority_id, hours]
      properties:
        operation:
          type: string
          enum: [upsert]
        category_id:
          type: string
          format: uuid
        priority_id:
          type: string
          format: uuid
        hours:
          type: string
          pattern: '^\d{1,4}(\.\d{1,2})?$'
          example: '12.00'
        expected_rule_id:
          type: string
          format: uuid
          nullable: true

    SlaRetireChange:
      type: object
      required: [operation, rule_id, expected_rule_id]
      properties:
        operation:
          type: string
          enum: [retire]
        rule_id:
          type: string
          format: uuid
        expected_rule_id:
          type: string
          format: uuid

    SlaBatchRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 20
          items:
            oneOf:
              - $ref: '#/components/schemas/SlaUpsertChange'
              - $ref: '#/components/schemas/SlaRetireChange'

    SlaBatchResponse:
      type: object
      required: [configuration_version, items]
      properties:
        configuration_version:
          $ref: '#/components/schemas/ConfigurationVersionRef'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SlaRuleAdmin'

    SlaRetireRequest:
      type: object
      required: [expected_rule_id]
      properties:
        expected_rule_id:
          type: string
          format: uuid

    ConfigEntityType:
      type: string
      enum: [category, priority, sla_rule]

    ConfigAction:
      type: string
      enum:
        - create
        - update
        - deactivate
        - reactivate
        - delete
        - set_default
        - rule_upsert
        - rule_retire

    ConfigHistoryEntry:
      type: object
      required:
        - id
        - configuration_version
        - entity_type
        - entity_id
        - action
        - actor
        - occurred_at
        - summary
      properties:
        id:
          type: string
          format: uuid
        configuration_version:
          $ref: '#/components/schemas/ConfigurationVersionRef'
        entity_type:
          $ref: '#/components/schemas/ConfigEntityType'
        entity_id:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/ConfigAction'
        actor:
          $ref: '#/components/schemas/UserRef'
        occurred_at:
          type: string
          format: date-time
        previous_values:
          type: object
          nullable: true
          additionalProperties: true
        new_values:
          type: object
          nullable: true
          additionalProperties: true
        summary:
          type: string

    Pagination:
      type: object
      required:
        - page
        - page_size
        - total_items
        - total_pages
        - has_next
        - has_previous
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_previous:
          type: boolean

    ConfigHistoryResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigHistoryEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

openapi: 3.1.0
info:
  title: Mesa de ayuda — HU-06 Reasignar o escalar ticket
  version: 1.0.0
  description: |
    Contrato HTTP de la historia HU-06. Permite al técnico **actualmente
    asignado** reasignar el ticket a otro técnico de su equipo y nivel, o
    escalarlo a un nivel superior del catálogo fijo
    (`nivel_1 < nivel_2 < especialista`).

    Reglas transversales:

    - La identidad se resuelve exclusivamente del token JWT enviado en
      `Authorization: Bearer <token>`.
    - Solo el técnico asignado vigente consulta opciones y ejecuta comandos;
      el creador, supervisores y administradores reciben `403`.
    - Cada cambio exige un motivo de 1 a 5.000 caracteres tras `strip()`.
    - El cambio de responsable se registra como una entrada **append-only**
      (`event_type = assignee_change`) y crea una notificación para el nuevo
      responsable en la misma transacción.
    - No se modifican `status`, `priority_id`, `category_id`, `sla_deadline`,
      `sla_version`, `finalized_at` ni `closed_at`.
    - Todos los mensajes de error van en español de España y usan el formato
      heredado de la API:

          {"detail": {"code": "...", "message": "..."}}

    Los payloads mal formados (UUID inválido, enum desconocido, fecha no ISO,
    campo extra) se normalizan a `422 invalid_request`.

servers:
  - url: /api/v1
    description: API v1 (mismo origen o proxy de Vite en desarrollo)

security:
  - bearerAuth: []

tags:
  - name: Cambio de responsable
    description: Opciones, reasignación y escalado de un ticket
  - name: Notificaciones
    description: Bandeja personal y marcado de lectura

paths:
  /tickets/{ticket_id}/assignee-change-options:
    get:
      tags: [Cambio de responsable]
      operationId: getAssigneeChangeOptions
      summary: Obtener candidatos, niveles superiores y capacidades
      description: |
        Devuelve el responsable actual, los compañeros candidatos a
        reasignación y los niveles de escalado estrictamente superiores al
        nivel del responsable actual.

        - Solo puede consultarlo el técnico asignado. El creador, un
          supervisor, un administrador o un técnico no asignado reciben `403`.
        - Un ticket en estado `resuelto` o `cerrado` devuelve
          `409 ticket_finalized` y no devuelve candidatos.
        - `has_reassignment_candidates` es verdadero si hay al menos un
          candidato; `has_available_escalation_target` es verdadero si hay al
          menos un nivel superior con `is_available = true`.
        - La lista es una ayuda de interfaz: el comando revalida siempre el
          destino contra el estado actual.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Opciones de cambio de responsable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssigneeChangeOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El usuario no es el técnico asignado o no tiene rol técnico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    detail:
                      code: forbidden
                      message: No tienes permiso para modificar este ticket.
                notAssignee:
                  value:
                    detail:
                      code: not_ticket_assignee
                      message: Este ticket ya no está asignado a ti.
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |-
            El ticket está finalizado y no admite cambios de responsable, o el
            responsable mostrado no coincide con el último cambio registrado en
            la línea temporal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ticketFinalized:
                  value:
                    detail:
                      code: ticket_finalized
                      message: El ticket está finalizado y no admite cambios de responsable.
                assigneeInconsistent:
                  value:
                    detail:
                      code: assignee_inconsistent
                      message: El responsable del ticket no coincide con el último cambio registrado. Actualiza la información e inténtalo de nuevo.
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticket_id}/reassignments:
    post:
      tags: [Cambio de responsable]
      operationId: createReassignment
      summary: Reasignar el ticket a otro técnico del mismo equipo y nivel
      description: |
        Comando transaccional e idempotente. Revalida que el destino sea un
        técnico activo, distinto del responsable actual y del usuario creador,
        del mismo equipo (si el actual tiene equipo) y del mismo nivel.

        Orden de validación relevante:

        1. Ticket existe (`404 ticket_not_found`).
        2. Replay de `request_id`: mismo actor, tipo, destino y motivo
           normalizado devuelve `200 changed=false` sin escribir; cualquier
           diferencia devuelve `409 request_id_reused`. Este replay exacto se
           resuelve antes de comprobar la asignación vigente para que un
           reintento de red siga siendo idempotente aunque el actor ya haya
           perdido el ticket.
        3. Para una solicitud nueva, el actor es el técnico asignado (`403`).
        4. Motivo no vacío y de hasta 5.000 caracteres.
        5. `expected_updated_at` coincide con `tickets.updated_at`.
        6. Estado activo (`abierto`, `en_progreso`, `pendiente_usuario`).
        7. Destino distinto del actual y del creador.
        8. Destino válido y disponible.

        En un cambio real se actualiza `tickets.assignee_id` y
        `tickets.updated_at`, se inserta una entrada `assignee_change` con
        `change_kind = reassignment` y se crea una notificación
        `ticket_reassigned` para el nuevo responsable.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignmentRequest'
            examples:
              reassign:
                summary: Reasignar a un compañero del mismo equipo y nivel
                value:
                  new_assignee_id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                  reason: Estoy de vacaciones; el compañero conoce el caso.
                  expected_updated_at: '2026-11-10T09:15:30.123456+00:00'
                  request_id: 6f1c2a7e-9b3d-4f4e-8a1b-2c3d4e5f6a7b
      responses:
        '200':
          description: Reasignación aplicada o replay idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssigneeChangeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |-
            Conflicto de estado o idempotencia: ticket finalizado, versión
            desactualizada, `request_id` reutilizado con otros datos o
            responsable incoherente con el último cambio registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ticketFinalized:
                  value:
                    detail:
                      code: ticket_finalized
                      message: El ticket está finalizado y no admite cambios de responsable.
                staleTicket:
                  value:
                    detail:
                      code: stale_ticket
                      message: El ticket ha sido modificado por otra persona. Actualiza la información e inténtalo de nuevo.
                assigneeInconsistent:
                  value:
                    detail:
                      code: assignee_inconsistent
                      message: El responsable del ticket no coincide con el último cambio registrado. Actualiza la información e inténtalo de nuevo.
                requestIdReused:
                  value:
                    detail:
                      code: request_id_reused
                      message: La solicitud ya se utilizó con otros datos. Genera una nueva solicitud e inténtalo de nuevo.
        '422':
          description: |-
            Validación de negocio o formato: motivo obligatorio o demasiado
            largo, autoasignación, creador como destino, destino no válido o
            payload mal formado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  value:
                    detail:
                      code: invalid_request
                      message: La solicitud no es válida. Revisa los datos e inténtalo de nuevo.
                reasonRequired:
                  value:
                    detail:
                      code: reason_required
                      message: Indica el motivo del cambio de responsable.
                reasonTooLong:
                  value:
                    detail:
                      code: reason_too_long
                      message: El motivo no puede superar los 5.000 caracteres.
                selfReassignment:
                  value:
                    detail:
                      code: self_reassignment
                      message: No puedes reasignarte el ticket a ti mismo.
                creatorNotAssignable:
                  value:
                    detail:
                      code: creator_not_assignable
                      message: Ese usuario no puede recibir este ticket.
                invalidReassignmentTarget:
                  value:
                    detail:
                      code: invalid_reassignment_target
                      message: Solo puedes reasignar a técnicos activos de tu equipo y de tu nivel.
                assigneeUnavailable:
                  value:
                    detail:
                      code: assignee_unavailable
                      message: El técnico seleccionado ya no está disponible. Actualiza la lista e inténtalo de nuevo.
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticket_id}/escalations:
    post:
      tags: [Cambio de responsable]
      operationId: createEscalation
      summary: Escalar el ticket a un nivel superior
      description: |
        Comando transaccional e idempotente. El técnico solo elige el **nivel
        destino**; el backend selecciona al nuevo responsable con una regla
        determinista:

        1. Técnicos activos con rol `tecnico` en el nivel destino,
           excluyendo al usuario creador del ticket.
        2. Preferencia por el equipo del responsable actual, si tiene equipo;
           si no hay candidatos en ese equipo, se usa el pool completo.
        3. Menor número de tickets activos.
        4. `lower(name)` ascendente y `User.id` ascendente como desempate final.

        Un replay idéntico compara el **nivel destino**, no la persona
        seleccionada, y no vuelve a seleccionar responsable.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationRequest'
            examples:
              escalate:
                summary: Escalar de Nivel 1 a Nivel 2
                value:
                  target_level: nivel_2
                  reason: Requiere permisos de administración del servidor.
                  expected_updated_at: '2026-11-10T09:15:30.123456+00:00'
                  request_id: 0b9e4d6a-1c2f-4a3b-8d7e-5f6a7b8c9d0e
      responses:
        '200':
          description: Escalado aplicado o replay idempotente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssigneeChangeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |-
            Conflicto de estado, catálogo o idempotencia: ticket finalizado,
            versión desactualizada, `request_id` reutilizado, nivel máximo,
            nivel sin técnicos disponibles o responsable incoherente con el
            último cambio registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ticketFinalized:
                  value:
                    detail:
                      code: ticket_finalized
                      message: El ticket está finalizado y no admite cambios de responsable.
                staleTicket:
                  value:
                    detail:
                      code: stale_ticket
                      message: El ticket ha sido modificado por otra persona. Actualiza la información e inténtalo de nuevo.
                assigneeInconsistent:
                  value:
                    detail:
                      code: assignee_inconsistent
                      message: El responsable del ticket no coincide con el último cambio registrado. Actualiza la información e inténtalo de nuevo.
                requestIdReused:
                  value:
                    detail:
                      code: request_id_reused
                      message: La solicitud ya se utilizó con otros datos. Genera una nueva solicitud e inténtalo de nuevo.
                noHigherLevel:
                  value:
                    detail:
                      code: no_higher_level
                      message: El ticket ya está en el nivel máximo de soporte.
                noTechniciansAvailable:
                  value:
                    detail:
                      code: no_technicians_available
                      message: No hay técnicos disponibles en ese nivel en este momento.
        '422':
          description: |-
            Validación de negocio o formato: motivo obligatorio o demasiado
            largo, nivel no superior, nivel desconocido o payload mal formado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRequest:
                  value:
                    detail:
                      code: invalid_request
                      message: La solicitud no es válida. Revisa los datos e inténtalo de nuevo.
                reasonRequired:
                  value:
                    detail:
                      code: reason_required
                      message: Indica el motivo del cambio de responsable.
                reasonTooLong:
                  value:
                    detail:
                      code: reason_too_long
                      message: El motivo no puede superar los 5.000 caracteres.
                invalidEscalationLevel:
                  value:
                    detail:
                      code: invalid_escalation_level
                      message: Debes elegir un nivel superior al del responsable actual.
        '500':
          $ref: '#/components/responses/InternalError'

  /me/notifications:
    get:
      tags: [Notificaciones]
      operationId: listMyNotifications
      summary: Obtener las notificaciones del usuario autenticado
      description: |
        Devuelve la bandeja personal ordenada por `created_at DESC, id DESC`.
        Solo se devuelven notificaciones cuyo `recipient_id` es el usuario del
        token; no existe un endpoint para leer las de otro usuario.

        `unread_count` se calcula sobre **toda** la bandeja del usuario, no
        solo sobre la página solicitada. La respuesta se marca como
        `Cache-Control: no-store` y `Vary: Authorization`.

        La campana de la interfaz consulta este recurso cada 15 segundos y
        refresca al recuperar foco o visibilidad.
      parameters:
        - name: page
          in: query
          required: false
          description: Página solicitada, empezando en 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: |-
            Notificaciones por página. Por defecto 20; mínimo 1 y máximo 100.
            Un valor fuera de rango devuelve `422 invalid_request`.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: unread_only
          in: query
          required: false
          description: |-
            Si es `true`, devuelve solo las notificaciones no leídas.
            `unread_count` sigue contando todas las no leídas del usuario.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Página de notificaciones y contador de no leídas
          headers:
            Cache-Control:
              description: Siempre `no-store`.
              schema:
                type: string
                example: no-store
            Vary:
              description: Incluye `Authorization`.
              schema:
                type: string
                example: Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/notifications/{notification_id}/read:
    post:
      tags: [Notificaciones]
      operationId: markMyNotificationRead
      summary: Marcar una notificación como leída
      description: |
        Comando idempotente. Si la notificación pertenece al usuario y no está
        leída, establece `is_read = true` y `read_at = now`, y devuelve
        `changed = true`. Si ya estaba leída, devuelve `changed = false` sin
        escribir.

        Si la notificación no existe o pertenece a otro usuario, devuelve
        `404 notification_not_found` para no revelar notificaciones ajenas.
        La notificación se conserva tras la lectura; no se borra.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notificación marcada como leída o ya leída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkNotificationReadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotificationNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TicketId:
      name: ticket_id
      in: path
      required: true
      description: Identificador UUID del ticket
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notification_id
      in: path
      required: true
      description: Identificador UUID de la notificación
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token ausente, inválido o caducado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notAuthenticated:
              value:
                detail:
                  code: not_authenticated
                  message: La sesión no es válida o ha caducado.
    Forbidden:
      description: Sin permiso para modificar el ticket o rol no autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                detail:
                  code: forbidden
                  message: No tienes permiso para modificar este ticket.
            notAssignee:
              value:
                detail:
                  code: not_ticket_assignee
                  message: Este ticket ya no está asignado a ti.
    TicketNotFound:
      description: El ticket no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                detail:
                  code: ticket_not_found
                  message: No se ha encontrado el ticket.
    NotificationNotFound:
      description: La notificación no existe o no pertenece al usuario autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                detail:
                  code: notification_not_found
                  message: No se ha encontrado la notificación.
    ValidationError:
      description: Payload o parámetros de consulta inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRequest:
              value:
                detail:
                  code: invalid_request
                  message: La solicitud no es válida. Revisa los datos e inténtalo de nuevo.
    InternalError:
      description: Error inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              value:
                detail:
                  code: internal_error
                  message: No se pudo guardar el cambio. El ticket no se ha modificado. Inténtalo de nuevo.

  schemas:
    TicketStatus:
      type: string
      description: Estados del ticket definidos en RF-02.1
      enum: [abierto, en_progreso, pendiente_usuario, resuelto, cerrado]
      example: en_progreso

    UserRole:
      type: string
      enum: [usuario, tecnico, supervisor, admin]
      example: tecnico

    EscalationLevel:
      type: string
      description: Niveles del catálogo fijo, de menor a mayor
      enum: [nivel_1, nivel_2, especialista]
      example: nivel_2

    AssigneeChangeKind:
      type: string
      enum: [reassignment, escalation]
      example: escalation

    NotificationType:
      type: string
      enum: [ticket_reassigned, ticket_escalated]
      example: ticket_escalated

    AuthorRef:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Técnico A
        role:
          $ref: '#/components/schemas/UserRole'

    AssigneeRef:
      type: object
      additionalProperties: false
      required: [id, name, role, team, escalation_level, escalation_level_label]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Técnico B
        role:
          $ref: '#/components/schemas/UserRole'
        team:
          type: [string, 'null']
          example: Soporte
        escalation_level:
          $ref: '#/components/schemas/EscalationLevel'
        escalation_level_label:
          type: string
          example: Nivel 1

    EscalationTarget:
      type: object
      additionalProperties: false
      required: [value, label, technician_count, is_available]
      properties:
        value:
          $ref: '#/components/schemas/EscalationLevel'
        label:
          type: string
          example: Nivel 2
        technician_count:
          type: integer
          minimum: 0
          description: Técnicos activos del nivel excluyendo al usuario creador del ticket, sin preferencia de equipo.
          example: 1
        is_available:
          type: boolean
          description: Verdadero si `technician_count > 0`.
          example: true

    AssigneeChangeOptions:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - status
        - current_assignee
        - has_reassignment_candidates
        - has_available_escalation_target
        - reassignment_candidates
        - escalation_targets
      properties:
        ticket_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TicketStatus'
        current_assignee:
          $ref: '#/components/schemas/AssigneeRef'
        has_reassignment_candidates:
          type: boolean
          description: Verdadero si `reassignment_candidates` no está vacío.
        has_available_escalation_target:
          type: boolean
          description: Verdadero si algún `escalation_targets` tiene `is_available = true`.
        reassignment_candidates:
          type: array
          description: |-
            Técnicos activos del mismo equipo y nivel que el responsable actual,
            excluyendo al responsable actual y al usuario creador. Ordenados por
            `lower(name) ASC, id ASC`.
          items:
            $ref: '#/components/schemas/AssigneeRef'
        escalation_targets:
          type: array
          description: |-
            Niveles estrictamente superiores al nivel del responsable actual,
            en orden ascendente. Puede estar vacío si el actual es el máximo.
          items:
            $ref: '#/components/schemas/EscalationTarget'
      example:
        ticket_id: 5c2b3d4e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
        status: en_progreso
        current_assignee:
          id: 3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
          name: Técnico A
          role: tecnico
          team: Soporte
          escalation_level: nivel_1
          escalation_level_label: Nivel 1
        has_reassignment_candidates: true
        has_available_escalation_target: true
        reassignment_candidates:
          - id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
            name: Técnico E
            role: tecnico
            team: Soporte
            escalation_level: nivel_1
            escalation_level_label: Nivel 1
        escalation_targets:
          - value: nivel_2
            label: Nivel 2
            technician_count: 1
            is_available: true
          - value: especialista
            label: Especialista
            technician_count: 1
            is_available: true

    ReassignmentRequest:
      type: object
      additionalProperties: false
      required: [new_assignee_id, reason, expected_updated_at, request_id]
      properties:
        new_assignee_id:
          type: string
          format: uuid
          description: Técnico destino; debe revalidarse contra el estado actual.
        reason:
          type: string
          description: |-
            Motivo del cambio. Se normaliza con `strip()` y debe quedar entre 1
            y 5.000 caracteres. La validación de negocio devuelve
            `reason_required` o `reason_too_long`; no se aplica `minLength` ni
            `maxLength` en el esquema para no degradar esos códigos a
            `invalid_request`.
        expected_updated_at:
          type: string
          format: date-time
          description: |-
            Valor de `updated_at` recibido en la última lectura del workflow.
            Un valor desactualizado devuelve `409 stale_ticket`.
        request_id:
          type: string
          format: uuid
          description: |-
            Clave de idempotencia obligatoria generada por el cliente. Un
            reintento idéntico devuelve `changed = false`; reutilizarla con
            otro actor, tipo, destino o motivo devuelve
            `409 request_id_reused`.
      example:
        new_assignee_id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
        reason: Estoy de vacaciones; el compañero conoce el caso.
        expected_updated_at: '2026-11-10T09:15:30.123456+00:00'
        request_id: 6f1c2a7e-9b3d-4f4e-8a1b-2c3d4e5f6a7b

    EscalationRequest:
      type: object
      additionalProperties: false
      required: [target_level, reason, expected_updated_at, request_id]
      properties:
        target_level:
          $ref: '#/components/schemas/EscalationLevel'
        reason:
          type: string
          description: |-
            Motivo del escalado. Se normaliza con `strip()` y debe quedar entre
            1 y 5.000 caracteres. La validación de negocio devuelve
            `reason_required` o `reason_too_long`; no se aplica `minLength` ni
            `maxLength` en el esquema para no degradar esos códigos a
            `invalid_request`.
        expected_updated_at:
          type: string
          format: date-time
          description: |-
            Valor de `updated_at` recibido en la última lectura del workflow.
            Un valor desactualizado devuelve `409 stale_ticket`.
        request_id:
          type: string
          format: uuid
          description: |-
            Clave de idempotencia obligatoria generada por el cliente. En un
            replay de escalado se compara el nivel destino, no la persona
            seleccionada.
      example:
        target_level: nivel_2
        reason: Requiere permisos de administración del servidor.
        expected_updated_at: '2026-11-10T09:15:30.123456+00:00'
        request_id: 0b9e4d6a-1c2f-4a3b-8d7e-5f6a7b8c9d0e

    StatusOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value:
          $ref: '#/components/schemas/TicketStatus'
        label:
          type: string
          example: En progreso

    TicketWorkflowSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - title
        - status
        - status_label
        - assignee_id
        - creator_id
        - finalized_at
        - closed_at
        - updated_at
        - allowed_transitions
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          example: TK-000101
        title:
          type: string
          example: No puedo acceder a la VPN desde casa
        status:
          $ref: '#/components/schemas/TicketStatus'
        status_label:
          type: string
          example: En progreso
        assignee_id:
          type: [string, 'null']
          format: uuid
        creator_id:
          type: string
          format: uuid
        finalized_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Token de concurrencia que debe enviarse como `expected_updated_at`.
        allowed_transitions:
          type: array
          items:
            $ref: '#/components/schemas/StatusOption'

    TimelineEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - from_status
        - to_status
        - body
        - is_internal
        - author
        - created_at
        - change_kind
        - previous_assignee
        - new_assignee
        - from_escalation_level
        - from_escalation_level_label
        - to_escalation_level
        - to_escalation_level_label
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: |-
            Tipo de entrada. `assignee_change` se añade en HU-06 al conjunto
            existente de HU-05.
          enum: [status_change, resolution, internal_comment, assignee_change]
          example: assignee_change
        from_status:
          oneOf:
            - $ref: '#/components/schemas/TicketStatus'
            - type: 'null'
        to_status:
          oneOf:
            - $ref: '#/components/schemas/TicketStatus'
            - type: 'null'
        body:
          type: [string, 'null']
          maxLength: 5000
          description: |-
            Motivo del cambio cuando `type = assignee_change`. Se renderiza
            siempre como texto plano.
        is_internal:
          type: boolean
        author:
          $ref: '#/components/schemas/AuthorRef'
        created_at:
          type: string
          format: date-time
        change_kind:
          oneOf:
            - $ref: '#/components/schemas/AssigneeChangeKind'
            - type: 'null'
        previous_assignee:
          oneOf:
            - $ref: '#/components/schemas/AssigneeRef'
            - type: 'null'
        new_assignee:
          oneOf:
            - $ref: '#/components/schemas/AssigneeRef'
            - type: 'null'
        from_escalation_level:
          oneOf:
            - $ref: '#/components/schemas/EscalationLevel'
            - type: 'null'
        from_escalation_level_label:
          type: [string, 'null']
          example: Nivel 1
        to_escalation_level:
          oneOf:
            - $ref: '#/components/schemas/EscalationLevel'
            - type: 'null'
        to_escalation_level_label:
          type: [string, 'null']
          example: Nivel 2
      example:
        id: 8b1f2a3c-4d5e-4f60-8a7b-9c0d1e2f3a4b
        type: assignee_change
        from_status: null
        to_status: null
        body: Requiere permisos de administración del servidor.
        is_internal: false
        author:
          id: 3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
          name: Técnico A
          role: tecnico
        created_at: '2026-11-10T09:16:00.000000+00:00'
        change_kind: escalation
        previous_assignee:
          id: 3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
          name: Técnico A
          role: tecnico
          team: Soporte
          escalation_level: nivel_1
          escalation_level_label: Nivel 1
        new_assignee:
          id: 9d0e1f2a-3b4c-4d5e-8f60-7a8b9c0d1e2f
          name: Técnico C
          role: tecnico
          team: Soporte
          escalation_level: nivel_2
          escalation_level_label: Nivel 2
        from_escalation_level: nivel_1
        from_escalation_level_label: Nivel 1
        to_escalation_level: nivel_2
        to_escalation_level_label: Nivel 2

    WorkflowResponse:
      type: object
      additionalProperties: false
      description: |-
        Respuesta de `GET /tickets/{ticket_id}/workflow` de HU-05, ampliada de
        forma aditiva con `can_reassign` y `can_escalate`.
      required:
        - ticket
        - can_change_status
        - can_comment_internally
        - can_view_internal
        - can_reassign
        - can_escalate
      properties:
        ticket:
          $ref: '#/components/schemas/TicketWorkflowSnapshot'
        can_change_status:
          type: boolean
        can_comment_internally:
          type: boolean
        can_view_internal:
          type: boolean
        can_reassign:
          type: boolean
          description: |-
            Verdadero solo si el usuario es el técnico asignado vigente y el
            ticket está en un estado activo.
        can_escalate:
          type: boolean
          description: |-
            Verdadero si `can_reassign` y el nivel del responsable actual no es
            `especialista`. No indica disponibilidad de técnicos en el nivel
            superior; para eso, `has_available_escalation_target` en las opciones.

    AssigneeChangeResponse:
      type: object
      additionalProperties: false
      required:
        - changed
        - message
        - ticket
        - previous_assignee
        - new_assignee
        - change_kind
        - from_escalation_level
        - from_escalation_level_label
        - to_escalation_level
        - to_escalation_level_label
        - timeline_entry
      properties:
        changed:
          type: boolean
          description: |-
            `false` cuando se reproduce un `request_id` ya aplicado con el
            mismo contenido. En ese caso no se escribe nada y
            `timeline_entry` es `null`.
        message:
          type: [string, 'null']
          example: Esta reasignación ya se aplicó con el identificador de solicitud indicado.
        ticket:
          $ref: '#/components/schemas/TicketWorkflowSnapshot'
        previous_assignee:
          $ref: '#/components/schemas/AssigneeRef'
        new_assignee:
          $ref: '#/components/schemas/AssigneeRef'
        change_kind:
          $ref: '#/components/schemas/AssigneeChangeKind'
        from_escalation_level:
          $ref: '#/components/schemas/EscalationLevel'
        from_escalation_level_label:
          type: string
          example: Nivel 1
        to_escalation_level:
          $ref: '#/components/schemas/EscalationLevel'
        to_escalation_level_label:
          type: string
          example: Nivel 2
        timeline_entry:
          oneOf:
            - $ref: '#/components/schemas/TimelineEntry'
            - type: 'null'
          description: Entrada creada por esta operación; `null` en un replay idempotente.
      example:
        changed: true
        message: null
        ticket:
          id: 5c2b3d4e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
          number: TK-000101
          title: No puedo acceder a la VPN desde casa
          status: en_progreso
          status_label: En progreso
          assignee_id: 9d0e1f2a-3b4c-4d5e-8f60-7a8b9c0d1e2f
          creator_id: 3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
          finalized_at: null
          closed_at: null
          updated_at: '2026-11-10T09:16:00.000000+00:00'
          allowed_transitions:
            - value: pendiente_usuario
              label: Pendiente de usuario
            - value: resuelto
              label: Resuelto
        previous_assignee:
          id: 3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
          name: Técnico A
          role: tecnico
          team: Soporte
          escalation_level: nivel_1
          escalation_level_label: Nivel 1
        new_assignee:
          id: 9d0e1f2a-3b4c-4d5e-8f60-7a8b9c0d1e2f
          name: Técnico C
          role: tecnico
          team: Soporte
          escalation_level: nivel_2
          escalation_level_label: Nivel 2
        change_kind: escalation
        from_escalation_level: nivel_1
        from_escalation_level_label: Nivel 1
        to_escalation_level: nivel_2
        to_escalation_level_label: Nivel 2
        timeline_entry:
          id: 8b1f2a3c-4d5e-4f60-8a7b-9c0d1e2f3a4b
          type: assignee_change
          from_status: null
          to_status: null
          body: Requiere permisos de administración del servidor.
          is_internal: false
          author:
            id: 3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
            name: Técnico A
            role: tecnico
          created_at: '2026-11-10T09:16:00.000000+00:00'
          change_kind: escalation
          previous_assignee:
            id: 3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
            name: Técnico A
            role: tecnico
            team: Soporte
            escalation_level: nivel_1
            escalation_level_label: Nivel 1
          new_assignee:
            id: 9d0e1f2a-3b4c-4d5e-8f60-7a8b9c0d1e2f
            name: Técnico C
            role: tecnico
            team: Soporte
            escalation_level: nivel_2
            escalation_level_label: Nivel 2
          from_escalation_level: nivel_1
          from_escalation_level_label: Nivel 1
          to_escalation_level: nivel_2
          to_escalation_level_label: Nivel 2

    Notification:

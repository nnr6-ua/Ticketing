openapi: 3.1.0
info:
  title: Mesa de ayuda — HU-03 Responder a la petición del técnico
  version: 1.0.0
  description: |
    Contrato HTTP de la historia HU-03. Amplía el contrato de HU-05 sin
    romperlo: los endpoints existentes conservan su forma y solo se añaden
    campos nuevos compatibles.

    Todos los mensajes de error van en español de España y usan el formato
    heredado de la API:

        {"detail": {"code": "...", "message": "..."}}

    La identidad se resuelve exclusivamente del token JWT enviado en
    `Authorization: Bearer <token>`.

servers:
  - url: /api/v1
    description: API v1 (mismo origen o proxy de Vite en desarrollo)

security:
  - bearerAuth: []

tags:
  - name: Ticket workflow
    description: Lecturas y comandos del flujo del ticket
  - name: Mis tickets
    description: Listado de tickets creados por el usuario autenticado

paths:
  /tickets/{ticket_id}/workflow:
    get:
      tags: [Ticket workflow]
      operationId: getTicketWorkflow
      summary: Obtener el estado actual, la petición activa y las capacidades
      description: |
        Devuelve el snapshot del ticket, los estados permitidos y las
        capacidades del usuario. HU-03 añade la petición activa, el aviso de
        respuesta pendiente y el recordatorio de 48 horas.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Snapshot del flujo del ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
              examples:
                creatorAwaiting:
                  summary: Creador con una petición pendiente
                  value:
                    ticket:
                      id: 0b9e4d6a-1c2f-4a3b-8d7e-5f6a7b8c9d0e
                      number: TK-2026-0001
                      title: No puedo acceder a la aplicación
                      status: pendiente_usuario
                      status_label: Pendiente de usuario
                      assignee_id: 7d1c2a7e-9b3d-4f4e-8a1b-2c3d4e5f6a7b
                      creator_id: 8e2d3b8f-ac4e-4f5f-9b2c-3d4e5f6a7b8c
                      finalized_at: null
                      closed_at: null
                      updated_at: '2026-11-13T10:00:00Z'
                      allowed_transitions: []
                    can_change_status: false
                    can_comment_internally: false
                    can_view_internal: false
                    can_request_information: false
                    can_respond_to_information: true
                    awaiting_user_response: true
                    active_information_request:
                      id: 6f1c2a7e-9b3d-4f4e-8a1b-2c3d4e5f6a7b
                      body: ¿Qué versión del navegador y sistema operativo usas?
                      requested_at: '2026-11-13T10:00:00Z'
                      requested_by:
                        id: 7d1c2a7e-9b3d-4f4e-8a1b-2c3d4e5f6a7b
                        name: Laura Técnica
                        role: tecnico
                    reminder_active: false
                    reminder_due_at: '2026-11-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticket_id}/information-requests:
    post:
      tags: [Ticket workflow]
      operationId: createInformationRequest
      summary: Solicitar información al usuario creador
      description: |
        Comando exclusivo del técnico asignado. Exige el ticket en
        `en_progreso`, un mensaje de 1 a 5.000 caracteres y un
        `expected_updated_at` vigente. En una sola transacción cambia el
        ticket a `pendiente_usuario` y registra la petición en la línea
        temporal.

        Un reintento con el mismo `request_id` y los mismos datos devuelve
        `200` con `changed = false` y no escribe nada.

        Si el usuario no puede leer el ticket, devuelve `404 ticket_not_found`.
        Si puede leerlo pero no es el técnico asignado, devuelve `403`.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationRequestRequest'
            examples:
              request:
                summary: Petición de información
                value:
                  body: ¿Qué versión del navegador y sistema operativo usas?
                  expected_updated_at: '2026-11-13T09:55:00Z'
                  request_id: 6f1c2a7e-9b3d-4f4e-8a1b-2c3d4e5f6a7b
      responses:
        '200':
          description: Reintento idempotente; la petición ya existía
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationRequestResponse'
        '201':
          description: Petición creada y ticket en «Pendiente de usuario»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflicto: transición no permitida, petición ya abierta, versión
            desactualizada o `request_id` reutilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidTransition:
                  value:
                    detail:
                      code: invalid_transition
                      message: 'No puedes pasar de Pendiente de usuario a Pendiente de usuario. Estados disponibles: En progreso.'
                alreadyOpen:
                  value:
                    detail:
                      code: information_request_already_open
                      message: Ya hay una petición de información pendiente de respuesta.
                stale:
                  value:
                    detail:
                      code: stale_ticket
                      message: El ticket ha sido modificado por otra persona. Actualiza la información e inténtalo de nuevo.
                reused:
                  value:
                    detail:
                      code: request_id_reused
                      message: La solicitud ya se utilizó con otros datos. Genera una nueva solicitud e inténtalo de nuevo.
        '422':
          description: Mensaje vacío, demasiado largo o payload no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                required:
                  value:
                    detail:
                      code: information_request_required
                      message: Escribe qué información necesitas del usuario.
                tooLong:
                  value:
                    detail:
                      code: information_request_too_long
                      message: La petición de información no puede superar los 5.000 caracteres.
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticket_id}/information-responses:
    post:
      tags: [Ticket workflow]
      operationId: createInformationResponse
      summary: Responder a la petición de información del técnico
      description: |
        Comando exclusivo del usuario creador. Exige el ticket en
        `pendiente_usuario` y una respuesta de 1 a 5.000 caracteres. En una
        sola transacción devuelve el ticket a `en_progreso` y registra la
        respuesta en la línea temporal.

        Si existe una petición activa, la respuesta se vincula con
        `reply_to_id`. Si el ticket es legado y no tiene petición, la
        respuesta se registra sin vínculo.

        Un reintento con el mismo `request_id` y los mismos datos devuelve
        `200` con `changed = false` y no escribe nada.

        Si el usuario no puede leer el ticket, devuelve `404 ticket_not_found`
        para no revelar su existencia. Si puede leerlo pero no es el creador
        (por ejemplo, un supervisor), devuelve `403 forbidden`.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationResponseRequest'
            examples:
              response:
                summary: Respuesta del creador
                value:
                  body: Uso Chrome 131 en Windows 11.
                  expected_updated_at: '2026-11-13T10:00:00Z'
                  request_id: 9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
      responses:
        '200':
          description: Reintento idempotente; la respuesta ya existía
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationResponseResponse'
        '201':
          description: Respuesta creada y ticket de vuelta a «En progreso»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationResponseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflicto: transición no permitida, versión desactualizada o
            `request_id` reutilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidTransition:
                  value:
                    detail:
                      code: invalid_transition
                      message: 'No puedes pasar de En progreso a En progreso. Estados disponibles: Pendiente de usuario, Resuelto.'
                stale:
                  value:
                    detail:
                      code: stale_ticket
                      message: El ticket ha sido modificado por otra persona. Actualiza la información e inténtalo de nuevo.
                reused:
                  value:
                    detail:
                      code: request_id_reused
                      message: La solicitud ya se utilizó con otros datos. Genera una nueva solicitud e inténtalo de nuevo.
        '422':
          description: Respuesta vacía, demasiado larga o payload no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                required:
                  value:
                    detail:
                      code: information_response_required
                      message: Escribe la información que te ha pedido el técnico.
                tooLong:
                  value:
                    detail:
                      code: information_response_too_long
                      message: La respuesta no puede superar los 5.000 caracteres.
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{ticket_id}/timeline:
    get:
      tags: [Ticket workflow]
      operationId: getTicketTimeline
      summary: Obtener la línea temporal visible
      description: |
        Cronología paginada del ticket. HU-03 añade los tipos
        `information_request` y `user_response` y el campo `reply_to_id`.
        Los comentarios internos siguen filtrándose en servidor.
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Página de la línea temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/tickets:
    get:
      tags: [Mis tickets]
      operationId: getMyTickets
      summary: Listar los tickets creados por el usuario autenticado
      description: |
        Resumen de los tickets del creador. HU-03 añade las marcas de espera
        de respuesta y del recordatorio de 48 horas. El cuerpo de la petición
        no se incluye para mantener el resumen ligero.
      responses:
        '200':
          description: Listado de tickets del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicketsResponse'
              examples:
                awaiting:
                  value:
                    items:
                      - id: 0b9e4d6a-1c2f-4a3b-8d7e-5f6a7b8c9d0e
                        ticket_number: TK-2026-0001
                        title: No puedo acceder a la aplicación
                        status: pendiente_usuario
                        status_label: Pendiente de usuario
                        category:
                          id: 5c4b3a2d-1e0f-4a9b-8c7d-6e5f4a3b2c1d
                          name: Acceso
                        priority:
                          id: 4d3c2b1a-0f9e-4d8c-7b6a-5f4e3d2c1b0a
                          name: Alta
                          level: 1
                          color: '#dc2626'
                        created_at: '2026-11-12T09:00:00Z'
                        updated_at: '2026-11-13T10:00:00Z'
                        awaiting_user_response: true
                        response_requested_at: '2026-11-13T10:00:00Z'
                        reminder_active: false
                        reminder_due_at: '2026-11-15T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TicketId:
      name: ticket_id
      in: path
      required: true
      description: Identificador UUID del ticket
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token JWT ausente, inválido o caducado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Rol o asignación no autorizados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                detail:
                  code: forbidden
                  message: No tienes permiso para modificar este ticket.
            notAssignee:
              value:
                detail:
                  code: not_ticket_assignee
                  message: Este ticket ya no está asignado a ti.
    NotFound:
      description: El ticket no existe o no es accesible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                detail:
                  code: ticket_not_found
                  message: No se ha encontrado el ticket.
    ValidationError:
      description: Payload o parámetros no válidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidRequest:
              value:
                detail:
                  code: invalid_request
                  message: La solicitud no es válida. Revisa los datos e inténtalo de nuevo.
    InternalError:
      description: Error inesperado del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              value:
                detail:
                  code: internal_error
                  message: No se pudo guardar el cambio. El ticket no se ha modificado. Inténtalo de nuevo.

  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          examples:
            - invalid_transition
        message:
          type: string
          description: Mensaje en español de España, apto para mostrar al usuario

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          $ref: '#/components/schemas/ErrorDetail'

    StatusOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value:
          $ref: '#/components/schemas/TicketStatus'
        label:
          type: string

    TicketStatus:
      type: string
      enum: [abierto, en_progreso, pendiente_usuario, resuelto, cerrado]

    TimelineEventType:
      type: string
      enum:
        - created
        - status_change
        - resolution
        - internal_comment
        - information_request
        - user_response

    UserRole:
      type: string
      enum: [usuario, tecnico, supervisor, admin]

    AuthorRef:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    TimelineEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - from_status
        - to_status
        - body
        - is_internal
        - author
        - created_at
        - reply_to_id
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TimelineEventType'
        from_status:
          oneOf:
            - $ref: '#/components/schemas/TicketStatus'
            - type: 'null'
        to_status:
          oneOf:
            - $ref: '#/components/schemas/TicketStatus'
            - type: 'null'
        body:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 5000
            - type: 'null'
        is_internal:
          type: boolean
        author:
          $ref: '#/components/schemas/AuthorRef'
        created_at:
          type: string
          format: date-time
        reply_to_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'

    InformationRequestRef:
      type: object
      additionalProperties: false
      required: [id, body, requested_at, requested_by]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 5000
        requested_at:
          type: string
          format: date-time
        requested_by:
          $ref: '#/components/schemas/AuthorRef'

    TicketWorkflowSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - title
        - status
        - status_label
        - assignee_id
        - creator_id
        - finalized_at
        - closed_at
        - updated_at
        - allowed_transitions
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        status_label:
          type: string
        assignee_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        creator_id:
          type: string
          format: uuid
        finalized_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        closed_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        updated_at:
          type: string
          format: date-time
        allowed_transitions:
          type: array
          items:
            $ref: '#/components/schemas/StatusOption'

    WorkflowResponse:
      type: object
      additionalProperties: false
      required:
        - ticket
        - can_change_status
        - can_comment_internally
        - can_view_internal
        - can_request_information
        - can_respond_to_information
        - awaiting_user_response
        - active_information_request
        - reminder_active
        - reminder_due_at
      properties:
        ticket:
          $ref: '#/components/schemas/TicketWorkflowSnapshot'
        can_change_status:
          type: boolean
        can_comment_internally:
          type: boolean
        can_view_internal:
          type: boolean
        can_request_information:
          type: boolean
        can_respond_to_information:
          type: boolean
        awaiting_user_response:
          type: boolean
        active_information_request:
          oneOf:
            - $ref: '#/components/schemas/InformationRequestRef'
            - type: 'null'
        reminder_active:
          type: boolean
        reminder_due_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'

    InformationRequestRequest:
      type: object
      additionalProperties: false
      required: [body, expected_updated_at, request_id]
      properties:
        body:
          type: string
          description: |
            Información concreta que necesita el técnico. La longitud
            (1–5000 tras `trim()`) se valida en el servicio con los códigos
            `information_request_required` e `information_request_too_long`.
        expected_updated_at:
          type: string
          format: date-time
          description: Token de concurrencia obtenido del snapshot del ticket
        request_id:
          type: string
          format: uuid
          description: Identificador de idempotencia generado por el cliente

    InformationRequestResponse:
      type: object
      additionalProperties: false
      required:
        - changed
        - message
        - ticket
        - timeline_entries
        - information_request
      properties:
        changed:
          type: boolean
        message:
          oneOf:
            - type: string
            - type: 'null'
        ticket:
          $ref: '#/components/schemas/TicketWorkflowSnapshot'
        timeline_entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        information_request:
          $ref: '#/components/schemas/InformationRequestRef'

    InformationResponseRequest:
      type: object
      additionalProperties: false
      required: [body, expected_updated_at, request_id]
      properties:
        body:
          type: string
          description: |
            Información solicitada por el técnico. La longitud (1–5000 tras
            `trim()`) se valida en el servicio con los códigos
            `information_response_required` e `information_response_too_long`.
        expected_updated_at:
          type: string
          format: date-time
          description: Token de concurrencia obtenido del snapshot del ticket
        request_id:
          type: string
          format: uuid
          description: Identificador de idempotencia generado por el cliente

    InformationResponseResponse:
      type: object
      additionalProperties: false
      required:
        - changed
        - message
        - ticket
        - timeline_entries
        - information_response
      properties:
        changed:
          type: boolean
        message:
          oneOf:
            - type: string
            - type: 'null'
        ticket:
          $ref: '#/components/schemas/TicketWorkflowSnapshot'
        timeline_entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        information_response:
          $ref: '#/components/schemas/TimelineEntry'

    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - page_size
        - total_items
        - total_pages
        - has_next
        - has_previous
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        has_next:
          type: boolean
        has_previous:
          type: boolean

    TimelineResponse:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    MyTicketCategory:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    MyTicketPriority:
      type: object
      additionalProperties: false
      required: [id, name, level, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: integer
        color:
          oneOf:
            - type: string
            - type: 'null'

    MyTicketSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - ticket_number
        - title
        - status
        - status_label
        - category
        - priority
        - created_at
        - updated_at
        - awaiting_user_response
        - response_requested_at
        - reminder_active
        - reminder_due_at
      properties:
        id:
          type: string
          format: uuid
        ticket_number:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/TicketStatus'
        status_label:
          type: string
        category:
          oneOf:
            - $ref: '#/components/schemas/MyTicketCategory'
            - type: 'null'
        priority:
          $ref: '#/components/schemas/MyTicketPriority'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        awaiting_user_response:
          type: boolean
        response_requested_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        reminder_active:
          type: boolean
        reminder_due_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'

    MyTicketsResponse:
      type: object
      additionalProperties: false
      required: [items]
